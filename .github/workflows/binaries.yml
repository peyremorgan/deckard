name: Publish binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x86_64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: ubuntu-24.04
            target: linux-x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libasound2t64
      - name: Install dependencies
        run: python -m pip install ".[dev,build]"
      - name: Run regression suite
        if: runner.os != 'Windows'
        run: python -m pytest -q
      - name: Run portable regression tests
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_diagnostics.py tests/test_theme.py tests/test_runtime.py tests/test_report.py -k "not test_http_api_assets_and_loopback_host_validation"
      - name: Build and archive
        run: python tools/build_binary.py
      - name: Test packaged application
        run: python tools/check_binary.py
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub prerelease
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release
      - name: Verify checksums
        working-directory: release
        run: sha256sum --check ./*.sha256
      - name: Publish binaries for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          tag="build-$COMMIT"
          cat > notes.txt <<EOF
          Automated main build from commit $COMMIT.

          Download the archive for your operating system and architecture, extract it, and launch Deckard.
          Python is bundled. Keep the extracted folder intact. SHA-256 checksum files accompany each archive.

          Windows supports local scans and reports. SSH scans and SSHFS require macOS or Linux.
          These builds are not signed with a Windows certificate or notarized by Apple.
          EOF
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --target "$COMMIT" \
              --title "Main build ${COMMIT:0:7}" --notes-file notes.txt --prerelease --latest=false
          fi
